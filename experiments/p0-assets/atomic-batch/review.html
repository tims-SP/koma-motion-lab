<script>const buttons=[...document.querySelectorAll('button[data-filter]')],cards=[...document.querySelectorAll('.item')];let active='all';function redraw(){const q=document.querySelector('#search').value.toLowerCase();let n=0;for(const el of cards){const ok=(active==='all'||el.dataset.category===active)&&el.dataset.keywords.includes(q);el.classList.toggle('hidden',!ok);if(ok)n++}document.querySelector('#count').textContent=n+' / '+cards.length+' 张源图';}buttons.forEach(b=>b.onclick=()=>{active=b.dataset.filter;buttons.forEach(x=>x.classList.toggle('active',x===b));redraw()});document.querySelector('#search').oninput=redraw;document.querySelector('#background').onchange=e=>{document.body.classList.remove('dark','white');if(e.target.value)document.body.classList.add(e.target.value)};redraw();</script></body></html>
