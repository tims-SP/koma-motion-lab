name: Mcode request audit local self-test
on:
  push:
    branches: [feature/koma-25d-core-021]
    paths:
      - '.github/workflows/koma-mcode-audit-test.yml'
      - 'experiments/reference-factory/tools/core026/mcode_egress_audit.cjs'
      - 'experiments/reference-factory/tools/core026/test_mcode_egress_audit.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-guard-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test denied request paths without contacting any external endpoint
        working-directory: experiments/reference-factory
        run: node tools/core026/test_mcode_egress_audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcode-audit-synthetic-text-only
          path: experiments/reference-factory/out/core026/mcode-egress-audit/trace.jsonl
          if-no-files-found: error
