name: MVP-009 head90 diagnostic QA
on:
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/head009
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run validate
      - name: Validate organ source and VDD
        run: |
          npx tsx scripts/validate-organ-data.ts
          npx tsx scripts/validate-vdd.ts
      - name: Start renderer for full WebGL diagnostics
        run: npm run dev > /tmp/head009-vite.log 2>&1 &
      - name: Verify seven view passes
        run: npm run audit
      - name: Verify organ alignment
        run: npm run audit:organs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head009-diagnostic-qa
          path: experiments/head009/out/head009/
          if-no-files-found: warn
          retention-days: 20
