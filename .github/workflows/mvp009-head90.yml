name: MVP-009 head90 implementation
on:
  push:
    branches: [main]
    paths:
      - 'experiments/head009/**'
      - '.github/workflows/mvp009-head90.yml'
  workflow_dispatch:
jobs:
  head90:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/head009
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Validate view-dependent organ controls and keyview preservation
        run: npx tsx scripts/validate-vdd.ts
      - run: npm run validate
      - name: Validate source organ semantics and negative controls
        run: npx tsx scripts/validate-organ-data.ts
      - run: npx playwright install --with-deps chromium
      - name: Start head renderer
        run: npm run dev > /tmp/head009-vite.log 2>&1 &
      - name: Audit real WebGL pixels at seven angles
        run: npm run audit
      - name: Audit independent eyes, nose, mouth, ears, jaw and hairline
        run: npm run audit:organs
      - name: Generate continuous 0-90 degree head sweep and organ topology checks
        run: npx tsx scripts/render-sweep.ts
      - name: Encode head sweep MP4
        if: always()
        run: |
          if ls out/head009/sweep-*.png >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -y -framerate 30 -i out/head009/sweep-%03d.png -c:v libx264 -preset medium -pix_fmt yuv420p out/head009/head90-sweep.mp4
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head009-head90-qa
          path: experiments/head009/out/head009/
          if-no-files-found: warn
          retention-days: 20
