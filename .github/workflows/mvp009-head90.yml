name: MVP-009 head90 implementation
on:
  push:
    branches: [main]
    paths:
      - 'experiments/head009/**'
      - '.github/workflows/mvp009-head90.yml'
  workflow_dispatch:
jobs:
  head90:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/head009
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - name: Start head renderer
        run: npm run dev > /tmp/head009-vite.log 2>&1 &
      - name: Audit real WebGL pixels at seven angles
        run: npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head009-head90-qa
          path: experiments/head009/out/head009/
          if-no-files-found: warn
          retention-days: 20
