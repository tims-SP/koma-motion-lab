name: PROD-010 - real Spine reference to native Rive Skin setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prod010-native-skin.yml'
      - 'scripts/spine_authoritative_rive.py'
permissions:
  contents: write
jobs:
  native-skin-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PROD_PRIVATE: /tmp/koma-spine-rive-reference
      PROD_REPORT: ${{ github.workspace }}/out/spine-rive
    steps:
      - uses: actions/checkout@v4
      - name: Install official reference and Rive dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libx11-6 libgl1 libgbm1 libxkbcommon0 libx11-xcb1 python3-venv
          python3 -m venv "$RUNNER_TEMP/rig-venv"
          "$RUNNER_TEMP/rig-venv/bin/pip" install --disable-pip-version-check \
            "git+https://github.com/BastienGimbert/SkelToJson.git" "Pillow==11.3.0"
          echo "$RUNNER_TEMP/rig-venv/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/spinecore" --no-save --no-audit --no-fund "@esotericsoftware/spine-core@4.2.120"
          curl -fsSL --retry 3 --retry-all-errors https://releases.rive.app/cli/install.sh -o "$RUNNER_TEMP/rive-install.sh"
          bash "$RUNNER_TEMP/rive-install.sh"
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Decode source and fetch original atlas only in runner
        run: |
          python scripts/spine_binary_conversion.py
          curl -fsSL --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/myssal/Reverse-1999-CN-Asset/45e75248ba3b25053fd32e63ab13c2f9f54dd9df/roles/300401_hongnujian/300401_hongnujian.atlas \
            -o "$PROD_PRIVATE/character.atlas"
      - name: Generate original setup vertex geometry by official Spine Runtime
        env:
          SPINE_CORE_ENTRY: ${{ runner.temp }}/spinecore/node_modules/@esotericsoftware/spine-core/dist/index.js
        run: |
          node scripts/spine_official_geometry.mjs \
            "$PROD_PRIVATE/source_spine.json" "$PROD_PRIVATE/character.atlas" \
            "$PROD_PRIVATE/spine-official-world-vertices.json"
      - name: Validate native Rive weighted Skin vs unskinned exact source setup
        run: python scripts/spine_authoritative_rive.py
      - name: Package verified native-skin scene and four pixel-level evidence frames
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,shutil,zipfile
          from pathlib import Path
          root=Path(os.environ["PROD_PRIVATE"])
          dest=root/"prod010-draft"
          dest.mkdir(exist_ok=True)
          report=json.loads((Path(os.environ["PROD_REPORT"])/"prod010-native-skin-check.json").read_text())
          assert report["status"]=="PASS_NATIVE_SETUP_AND_BONE_POKE"
          samples=[
            "native-referenced-setup.png",
            "unskinned-referenced-setup.png",
            "native-skin-bone-poked.png",
            "unskinned-bone-poked.png",
          ]
          for name in samples:
            assert (root/name).is_file() and (root/name).stat().st_size>5000,name
            shutil.copy2(root/name,dest/name)
          shutil.copy2(Path(os.environ["PROD_REPORT"])/"prod010-native-skin-check.json",dest/"05-rig-skin-diagnostics.json")
          project=root/"source-mesh-rive"
          assert (project/"scene.rml").is_file()
          with zipfile.ZipFile(dest/"native-skin-rml-project.zip","w",zipfile.ZIP_DEFLATED) as archive:
            for file in project.rglob("*"):
              if file.is_file():
                archive.write(file,file.relative_to(project))
          print("PASS_PRIVATE_PROOF_PACKAGE",[(p.name,p.stat().st_size) for p in dest.iterdir()])
          PY
      - name: Store images and source-asset-derived RML ONLY in DRAFT Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="prod010-rive-skin-proof-${GITHUB_RUN_ID}"
          gh release create "$tag" "$PROD_PRIVATE/prod010-draft/"*             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft             --title "PROD-010 native Rive Skin setup proof only - NOT full conversion"             --notes "Independent official Spine 4.2 setup vertex and UV basis. Native Rive Skin vs unskinned pixel parity and actual Bone rotation poke verified. Experimental setup-only proof: incomplete source constraints, unhandled >4 weight vertices, no editable .riv animation, no approved pose video. Media is stored only in this DRAFT Release, not the Git tree."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets             --jq '{url:.url,isDraft:.isDraft,assets:[.assets[].name]}'
      - name: Publish text-only status
        if: always()
        run: |
          if test -s "$PROD_REPORT/prod010-native-skin-check.json"; then
            cat "$PROD_REPORT/prod010-native-skin-check.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "No source images, screenshots, RML or generated binary published to Git." >> "$GITHUB_STEP_SUMMARY"
