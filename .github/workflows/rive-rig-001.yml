name: RIVE-RIG-001 — CLI probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rive-rig-001.yml'
      - 'scripts/rive_probe.sh'
      - 'scripts/rive_weighted_arm.sh'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  rive-cli-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout lab repository
        uses: actions/checkout@v4

      - name: Prepare experiment directory
        shell: bash
        run: mkdir -p out/rive-rig-001/logs

      - name: Install Linux graphics runtime libraries required by Rive CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libx11-6 libgl1 libgbm1 libxkbcommon0 libx11-xcb1
          ldconfig -p | grep -E 'libEGL.so.1|libGLESv2.so.2|libX11.so.6' | tee out/rive-rig-001/logs/graphics-libraries.log

      - name: Install official Rive CLI on runner (do not commit proprietary binary)
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors -fsSL \
            https://releases.rive.app/cli/install.sh \
            -o "$RUNNER_TEMP/rive-install.sh"
          sha256sum "$RUNNER_TEMP/rive-install.sh" | tee out/rive-rig-001/installer.sha256
          bash "$RUNNER_TEMP/rive-install.sh" 2>&1 | tee out/rive-rig-001/logs/installer.log
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
          if [ -x "$HOME/.rive/bin/rive" ]; then
            sha256sum "$HOME/.rive/bin/rive" | tee out/rive-rig-001/rive-cli.sha256
          fi

      - name: RIVE-RIG-001 no-editor smoke test and capability discovery
        shell: bash
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/out/rive-rig-001
        run: bash scripts/rive_probe.sh

      - name: RIVE-RIG-001 actual weighted arm pose probe
        shell: bash
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/out/rive-rig-001
        run: bash scripts/rive_weighted_arm.sh

      - name: Publish actionable summary
        if: always()
        shell: bash
        run: |
          if [ -f out/rive-rig-001/summary.md ]; then
            cat out/rive-rig-001/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Rive CLI probe did not reach result generation. Inspect installer.log.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs, project scaffold, schema and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rive-rig-001-evidence-${{ github.run_number }}
          path: out/rive-rig-001/
          retention-days: 14
          if-no-files-found: warn
