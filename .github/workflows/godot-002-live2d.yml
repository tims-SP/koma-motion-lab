name: GODOT-002 · Real MOC3 Godot movie

on:
  push:
    branches:
      - validation/godot-002-live2d
    paths:
      - '.github/workflows/godot-002-live2d.yml'
      - 'experiments/godot-002/**'
      - 'scripts/godot_002_*.py'
  pull_request:
    paths:
      - '.github/workflows/godot-002-live2d.yml'
      - 'experiments/godot-002/**'
      - 'scripts/godot_002_*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-live2d:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout only source code
        uses: actions/checkout@v4
      - name: Install toolchain, Mesa and validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build pkg-config python3-venv \
            xvfb xauth mesa-utils libgl1-mesa-dri libgl1 ffmpeg unzip gdb
          python3 -m venv "$RUNNER_TEMP/gd002venv"
          "$RUNNER_TEMP/gd002venv/bin/pip" install --disable-pip-version-check \
            'scons==4.7.0' 'Pillow==11.3.0'
          echo "$RUNNER_TEMP/gd002venv/bin" >> "$GITHUB_PATH"
      - name: Stage real source model privately inside runner
        shell: bash
        env:
          GODOT002_PROJECT: ${{ runner.temp }}/gd002-project
          GODOT002_OUT: ${{ github.workspace }}/out/godot-002
        run: |
          set -euo pipefail
          mkdir -p "$GODOT002_PROJECT" "$GODOT002_OUT"
          cp -a experiments/godot-002/. "$GODOT002_PROJECT/"
          python scripts/godot_002_stage.py
      - name: Build open-source Purism Core v5 ABI replacement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/godot-002
          git clone --depth 1 https://github.com/SakuraMotion/PurismCore.git "$RUNNER_TEMP/PurismCore"
          git -C "$RUNNER_TEMP/PurismCore" rev-parse HEAD | tee out/godot-002/purism-commit.txt
          # GDCubism itself requires legacy v5 ABI, but the upstream moc3info
          # diagnostic is v6-only. Build each in an isolated CMake directory.
          cmake -S "$RUNNER_TEMP/PurismCore" -B "$RUNNER_TEMP/PurismCore/build" \
            -DCMAKE_BUILD_TYPE=Release -DPURISM_CORE_ABI=v5 -DBUILD_SHARED_LIBS=OFF
          cmake --build "$RUNNER_TEMP/PurismCore/build" --parallel 2 \
            2>&1 | tee out/godot-002/purism-build.log
          find "$RUNNER_TEMP/PurismCore/build" -name '*.a' | tee out/godot-002/purism-archives.txt
          cmake -S "$RUNNER_TEMP/PurismCore" -B "$RUNNER_TEMP/PurismCore/build-v6" \
            -DCMAKE_BUILD_TYPE=Release -DPURISM_CORE_ABI=v6 -DBUILD_SHARED_LIBS=OFF -DPURISM_CORE_BUILD_SAMPLES=ON
          cmake --build "$RUNNER_TEMP/PurismCore/build-v6" --parallel 2 \
            2>&1 | tee out/godot-002/purism-v6-build.log
          "$RUNNER_TEMP/PurismCore/build-v6/moc3info" \
            "$RUNNER_TEMP/gd002-project/assets/301003_x/301003_x.moc3" \
            > out/godot-002/purism-moc3info.json
          python -m json.tool out/godot-002/purism-moc3info.json > /dev/null
          echo "GODOT002_PURISM_CORE_REAL_MOC3_DECODE_PASS"
          cc -std=c11 -O0 -g -Wall -Wextra \
            -I "$RUNNER_TEMP/PurismCore/include" \
            experiments/godot-002/purism_v5_probe.c \
            "$RUNNER_TEMP/PurismCore/build/libPurismCore-v5.a" -lm \
            -o "$RUNNER_TEMP/psm-v5-probe"
          "$RUNNER_TEMP/psm-v5-probe" \
            "$RUNNER_TEMP/gd002-project/assets/301003_x/301003_x.moc3" \
            2>&1 | tee out/godot-002/purism-v5-probe.log
          grep -q '^PSM_V5_PHASE_PASS$' out/godot-002/purism-v5-probe.log
      - name: Restore GDCubism build cache (no artwork)
        id: gd002-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/gdcubism
          key: gd002-gdcubism-0.9.1-purism-v5-cubism-5r1-trace-v2
      - name: Build GDCubism with Purism Core, no proprietary SDK download
        shell: bash
        run: |
          set -euo pipefail
          cached="$GITHUB_WORKSPACE/.ci-cache/gdcubism/gd_cubism"
          if test -s "$cached/bin/libgd_cubism.linux.release.x86_64.so"; then
            mkdir -p "$RUNNER_TEMP/gd002-project/addons"
            cp -a "$cached" "$RUNNER_TEMP/gd002-project/addons/gd_cubism"
            sha256sum "$cached/bin/libgd_cubism.linux.release.x86_64.so" \
              | tee out/godot-002/gdcubism-library.sha256
            echo "GODOT002_CACHED_EXTENSION_REUSED"
            exit 0
          fi
          git clone --depth 1 --branch v0.9.1 https://github.com/MizunagiKB/gd_cubism.git "$RUNNER_TEMP/gd_cubism"
          git -C "$RUNNER_TEMP/gd_cubism" submodule update --init --depth 1 godot-cpp
          git clone --depth 1 --branch 5-r.1 https://github.com/Live2D/CubismNativeFramework.git "$RUNNER_TEMP/CubismNativeFramework"
          git -C "$RUNNER_TEMP/gd_cubism" rev-parse HEAD | tee out/godot-002/gdcubism-commit.txt
          git -C "$RUNNER_TEMP/CubismNativeFramework" rev-parse HEAD | tee out/godot-002/framework-commit.txt
          python3 "$GITHUB_WORKSPACE/scripts/godot_002_trace_patch.py" "$RUNNER_TEMP/gd_cubism"
          cd "$RUNNER_TEMP/gd_cubism"
          sdk="$PWD/thirdparty/CubismSdkForNative-Lab"
          mkdir -p "$sdk/Core/include" "$sdk/Core/lib/linux/x86_64"
          cp "$RUNNER_TEMP/PurismCore/include/"*.h "$sdk/Core/include/"
          # Cubism 5-r.1 includes the Core header inside a C++ namespace. PurismCore's
          # stdint include must not import glibc typedefs into that namespace.
          python3 - "$sdk/Core/include/Live2DCubismCore.h" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          assert '#include "PurismCore.h"' in s
          s = s.replace('#include "PurismCore.h"', '#define PSM_COMPAT_VERSION 0x05010000L\n#define PSM_HAS_STDINT 0\n#include "PurismCore.h"')
          p.write_text(s)
          PY
          archive=$(find "$RUNNER_TEMP/PurismCore/build" -name 'libPurismCore-v5.a' -print -quit)
          test -n "$archive" && test -s "$archive"
          cp "$archive" "$sdk/Core/lib/linux/x86_64/libLive2DCubismCore.a"
          ln -s "$RUNNER_TEMP/CubismNativeFramework" "$sdk/Framework"
          scons platform=linux arch=x86_64 target=template_release -j4 \
            2>&1 | tee "$GITHUB_WORKSPACE/out/godot-002/gdcubism-build.log"
          lib=demo/addons/gd_cubism/bin/libgd_cubism.linux.release.x86_64.so
          test -s "$lib"
          mkdir -p "$RUNNER_TEMP/gd002-project/addons"
          cp -a demo/addons/gd_cubism "$RUNNER_TEMP/gd002-project/addons/"
          # The editor requests linux.debug; use the exact same tested template_release
          # shared object for both editor import and runtime. No mocked model class.
          sed -i 's@bin/libgd_cubism.linux.debug.x86_64.so@bin/libgd_cubism.linux.release.x86_64.so@g' \
            "$RUNNER_TEMP/gd002-project/addons/gd_cubism/gd_cubism.gdextension"
          # Demo scenes are not part of the experiment and can introduce unrelated errors.
          rm -rf "$RUNNER_TEMP/gd002-project/addons/gd_cubism/example"
          sha256sum "$lib" | tee "$GITHUB_WORKSPACE/out/godot-002/gdcubism-library.sha256"
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache/gdcubism"
          cp -a "$RUNNER_TEMP/gd002-project/addons/gd_cubism" "$GITHUB_WORKSPACE/.ci-cache/gdcubism/"
      - name: Cache successful native extension compilation
        if: success() && steps.gd002-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/gdcubism
          key: gd002-gdcubism-0.9.1-purism-v5-cubism-5r1-trace-v2
      - name: Install official Godot 4.7.2 Linux binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --version
          echo "GODOT_BIN=$RUNNER_TEMP/godot" >> "$GITHUB_ENV"
      - name: Render real character nod motion with Xvfb and Mesa llvmpipe
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            glxinfo -B | tee out/godot-002/glxinfo.txt
          xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --editor --path "$RUNNER_TEMP/gd002-project" --import \
            2>&1 | tee out/godot-002/import.log
          if grep -E 'GDExtension dynamic library not found|Can.t open dynamic library|SCRIPT ERROR|Failed loading.*gd_cubism' out/godot-002/import.log; then
            echo "GODOT002_FAIL_IMPORT_HAS_EXTENSION_ERRORS"
            exit 21
          fi
          # First prove that GDCubism can be instantiated independently of
          # real MOC3 parsing. This probe intentionally does NOT count as playback.
          GODOT002_CONSTRUCT_ONLY=1 xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
            --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --quit-after 5 \
            2>&1 | tee out/godot-002/construct-only.log
          grep -q 'GODOT002_CONSTRUCT_ONLY_PASS' out/godot-002/construct-only.log
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
            --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --write-movie "$GITHUB_WORKSPACE/out/godot-002/shot.png" \
            --fixed-fps 30 --quit-after 90 \
            2>&1 | tee out/godot-002/godot-render.log
          render_status=${PIPESTATUS[0]}
          set -e
          if [ "$render_status" -ne 0 ]; then
            echo "GODOT002_RUNTIME_CRASH rc=$render_status; collecting native stack trace"
            ulimit -c 0
            xvfb-run -a -s '-screen 0 1280x720x24' \
              gdb -q -batch \
              -ex 'set pagination off' -ex 'run' -ex 'thread apply all bt 20' \
              --args "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
              --audio-driver Dummy \
              --rendering-method gl_compatibility --rendering-driver opengl3 \
              --write-movie "$GITHUB_WORKSPACE/out/godot-002/debug-shot.png" \
              --fixed-fps 30 --quit-after 5 \
              2>&1 | tee out/godot-002/gdb-backtrace.log || true
            exit "$render_status"
          fi
          grep -q 'GODOT002_REAL_MOTION_STARTED' out/godot-002/godot-render.log
          ffmpeg -hide_banner -loglevel warning -y -framerate 30 \
            -pattern_type glob -i 'out/godot-002/shot*.png' \
            -c:v libx264 -crf 18 -pix_fmt yuv420p \
            out/godot-002/preview.mp4
      - name: Validate pixels, animation and MP4 independently
        shell: bash
        run: |
          set -euo pipefail
          python scripts/godot_002_verify.py
          cat out/godot-002/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Keep game-derived preview in draft Release, not public release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="godot-002-review-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            out/godot-002/preview.mp4 \
            out/godot-002/contact-sheet.jpg \
            out/godot-002/summary.json \
            --draft \
            --title "GODOT-002 private inspection #${GITHUB_RUN_NUMBER}" \
            --notes "Draft only: contains game-derived character footage. Do not publish without asset rights. Playback test, not original Cubism visual parity."
      - name: Upload text-only diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-002-text-diagnostics-${{ github.run_number }}
          path: |
            out/godot-002/*.json
            out/godot-002/*.log
            out/godot-002/*.txt
            out/godot-002/*.sha256
          if-no-files-found: warn
          retention-days: 7
