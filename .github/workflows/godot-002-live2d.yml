name: GODOT-002 · Real MOC3 Godot movie

on:
  push:
    branches:
      - validation/godot-002-live2d
      - validation/godot-004-hires-idle
    paths:
      - '.github/workflows/godot-002-live2d.yml'
      - 'experiments/godot-002/**'
      - 'scripts/godot_002_*.py'
      - 'scripts/godot_004_*.py'
  pull_request:
    paths:
      - '.github/workflows/godot-002-live2d.yml'
      - 'experiments/godot-002/**'
      - 'scripts/godot_002_*.py'
      - 'scripts/godot_004_*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-live2d:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout only source code
        uses: actions/checkout@v4
      - name: Install toolchain, Mesa and validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build pkg-config python3-venv \
            xvfb xauth mesa-utils libgl1-mesa-dri libgl1 ffmpeg unzip gdb
          python3 -m venv "$RUNNER_TEMP/gd002venv"
          "$RUNNER_TEMP/gd002venv/bin/pip" install --disable-pip-version-check \
            'scons==4.7.0' 'Pillow==11.3.0'
          echo "$RUNNER_TEMP/gd002venv/bin" >> "$GITHUB_PATH"
      - name: Stage real source model privately inside runner
        shell: bash
        env:
          GODOT002_PROJECT: ${{ runner.temp }}/gd002-project
          GODOT002_OUT: ${{ github.workspace }}/out/godot-002
        run: |
          set -euo pipefail
          mkdir -p "$GODOT002_PROJECT" "$GODOT002_OUT"
          cp -a experiments/godot-002/. "$GODOT002_PROJECT/"
          python scripts/godot_002_stage.py
      - name: Build open-source Purism Core v5 ABI replacement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/godot-002
          git clone --depth 1 https://github.com/SakuraMotion/PurismCore.git "$RUNNER_TEMP/PurismCore"
          git -C "$RUNNER_TEMP/PurismCore" rev-parse HEAD | tee out/godot-002/purism-commit.txt
          # GDCubism itself requires legacy v5 ABI, but the upstream moc3info
          # diagnostic is v6-only. Build each in an isolated CMake directory.
          cmake -S "$RUNNER_TEMP/PurismCore" -B "$RUNNER_TEMP/PurismCore/build" \
            -DCMAKE_BUILD_TYPE=Release -DPURISM_CORE_ABI=v5 -DBUILD_SHARED_LIBS=OFF
          cmake --build "$RUNNER_TEMP/PurismCore/build" --parallel 2 \
            2>&1 | tee out/godot-002/purism-build.log
          find "$RUNNER_TEMP/PurismCore/build" -name '*.a' | tee out/godot-002/purism-archives.txt
          cmake -S "$RUNNER_TEMP/PurismCore" -B "$RUNNER_TEMP/PurismCore/build-v6" \
            -DCMAKE_BUILD_TYPE=Release -DPURISM_CORE_ABI=v6 -DBUILD_SHARED_LIBS=OFF -DPURISM_CORE_BUILD_SAMPLES=ON
          cmake --build "$RUNNER_TEMP/PurismCore/build-v6" --parallel 2 \
            2>&1 | tee out/godot-002/purism-v6-build.log
          "$RUNNER_TEMP/PurismCore/build-v6/moc3info" \
            "$RUNNER_TEMP/gd002-project/assets/301003_x/301003_x.moc3" \
            > out/godot-002/purism-moc3info.json
          python -m json.tool out/godot-002/purism-moc3info.json > /dev/null
          echo "GODOT002_PURISM_CORE_REAL_MOC3_DECODE_PASS"
          cc -std=c11 -O0 -g -Wall -Wextra \
            -I "$RUNNER_TEMP/PurismCore/include" \
            experiments/godot-002/purism_v5_probe.c \
            "$RUNNER_TEMP/PurismCore/build/libPurismCore-v5.a" -lm \
            -o "$RUNNER_TEMP/psm-v5-probe"
          "$RUNNER_TEMP/psm-v5-probe" \
            "$RUNNER_TEMP/gd002-project/assets/301003_x/301003_x.moc3" \
            2>&1 | tee out/godot-002/purism-v5-probe.log
          grep -q '^PSM_V5_PHASE_PASS$' out/godot-002/purism-v5-probe.log
      - name: Restore GDCubism build cache (no artwork)
        id: gd002-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/gdcubism
          key: gd002-gdcubism-0.9.1-purism-v5-cubism-5r1-trace-v2
      - name: Build GDCubism with Purism Core, no proprietary SDK download
        shell: bash
        run: |
          set -euo pipefail
          cached="$GITHUB_WORKSPACE/.ci-cache/gdcubism/gd_cubism"
          if test -s "$cached/bin/libgd_cubism.linux.release.x86_64.so"; then
            mkdir -p "$RUNNER_TEMP/gd002-project/addons"
            cp -a "$cached" "$RUNNER_TEMP/gd002-project/addons/gd_cubism"
            sha256sum "$cached/bin/libgd_cubism.linux.release.x86_64.so" \
              | tee out/godot-002/gdcubism-library.sha256
            echo "GODOT002_CACHED_EXTENSION_REUSED"
            exit 0
          fi
          git clone --depth 1 --branch v0.9.1 https://github.com/MizunagiKB/gd_cubism.git "$RUNNER_TEMP/gd_cubism"
          git -C "$RUNNER_TEMP/gd_cubism" submodule update --init --depth 1 godot-cpp
          git clone --depth 1 --branch 5-r.1 https://github.com/Live2D/CubismNativeFramework.git "$RUNNER_TEMP/CubismNativeFramework"
          git -C "$RUNNER_TEMP/gd_cubism" rev-parse HEAD | tee out/godot-002/gdcubism-commit.txt
          git -C "$RUNNER_TEMP/CubismNativeFramework" rev-parse HEAD | tee out/godot-002/framework-commit.txt
          python3 "$GITHUB_WORKSPACE/scripts/godot_002_trace_patch.py" "$RUNNER_TEMP/gd_cubism"
          cd "$RUNNER_TEMP/gd_cubism"
          sdk="$PWD/thirdparty/CubismSdkForNative-Lab"
          mkdir -p "$sdk/Core/include" "$sdk/Core/lib/linux/x86_64"
          cp "$RUNNER_TEMP/PurismCore/include/"*.h "$sdk/Core/include/"
          # Cubism 5-r.1 includes the Core header inside a C++ namespace. PurismCore's
          # stdint include must not import glibc typedefs into that namespace.
          python3 - "$sdk/Core/include/Live2DCubismCore.h" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          assert '#include "PurismCore.h"' in s
          s = s.replace('#include "PurismCore.h"', '#define PSM_COMPAT_VERSION 0x05010000L\n#define PSM_HAS_STDINT 0\n#include "PurismCore.h"')
          p.write_text(s)
          PY
          archive=$(find "$RUNNER_TEMP/PurismCore/build" -name 'libPurismCore-v5.a' -print -quit)
          test -n "$archive" && test -s "$archive"
          cp "$archive" "$sdk/Core/lib/linux/x86_64/libLive2DCubismCore.a"
          ln -s "$RUNNER_TEMP/CubismNativeFramework" "$sdk/Framework"
          scons platform=linux arch=x86_64 target=template_release -j4 \
            2>&1 | tee "$GITHUB_WORKSPACE/out/godot-002/gdcubism-build.log"
          lib=demo/addons/gd_cubism/bin/libgd_cubism.linux.release.x86_64.so
          test -s "$lib"
          mkdir -p "$RUNNER_TEMP/gd002-project/addons"
          cp -a demo/addons/gd_cubism "$RUNNER_TEMP/gd002-project/addons/"
          # The editor requests linux.debug; use the exact same tested template_release
          # shared object for both editor import and runtime. No mocked model class.
          sed -i 's@bin/libgd_cubism.linux.debug.x86_64.so@bin/libgd_cubism.linux.release.x86_64.so@g' \
            "$RUNNER_TEMP/gd002-project/addons/gd_cubism/gd_cubism.gdextension"
          # Demo scenes are not part of the experiment and can introduce unrelated errors.
          rm -rf "$RUNNER_TEMP/gd002-project/addons/gd_cubism/example"
          sha256sum "$lib" | tee "$GITHUB_WORKSPACE/out/godot-002/gdcubism-library.sha256"
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache/gdcubism"
          cp -a "$RUNNER_TEMP/gd002-project/addons/gd_cubism" "$GITHUB_WORKSPACE/.ci-cache/gdcubism/"
      - name: Cache successful native extension compilation
        if: success() && steps.gd002-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/gdcubism
          key: gd002-gdcubism-0.9.1-purism-v5-cubism-5r1-trace-v2
      - name: Install official Godot 4.7.2 Linux binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --version
          echo "GODOT_BIN=$RUNNER_TEMP/godot" >> "$GITHUB_ENV"
      - name: Render real character nod motion with Xvfb and Mesa llvmpipe
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            glxinfo -B | tee out/godot-002/glxinfo.txt
          xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --editor --path "$RUNNER_TEMP/gd002-project" --import \
            2>&1 | tee out/godot-002/import.log
          if grep -E 'GDExtension dynamic library not found|Can.t open dynamic library|SCRIPT ERROR|Failed loading.*gd_cubism' out/godot-002/import.log; then
            echo "GODOT002_FAIL_IMPORT_HAS_EXTENSION_ERRORS"
            exit 21
          fi
          # First prove that GDCubism can be instantiated independently of
          # real MOC3 parsing. This probe intentionally does NOT count as playback.
          GODOT002_CONSTRUCT_ONLY=1 xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
            --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --quit-after 5 \
            2>&1 | tee out/godot-002/construct-only.log
          grep -q 'GODOT002_CONSTRUCT_ONLY_PASS' out/godot-002/construct-only.log
          # Isolate model JSON + MOC + mesh/texture initialization WITHOUT
          # the original motion parser. Keep static art strictly private in Runner.
          GODOT002_DISABLE_MOTIONS=1 xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
            --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --write-movie "$GITHUB_WORKSPACE/out/godot-002/static.png" \
            --fixed-fps 30 --quit-after 15 \
            2>&1 | tee out/godot-002/static-model.log
          grep -q 'GODOT002_STATIC_MODEL_LOAD_PASS' out/godot-002/static-model.log
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          paths=sorted(Path("out/godot-002").glob("static*.png"))
          assert len(paths)==15, f"expected 15 static model frames, got {len(paths)}"
          image=Image.open(paths[len(paths)//2]).convert("RGB").resize((96,54))
          bg=(18,28,43)
          coverage=sum(1 for p in image.getdata()
              if sum(abs(p[c]-bg[c]) for c in range(3))>90)/5184
          print("GODOT002_STATIC_VISIBLE_FOREGROUND_RATIO",round(coverage,4))
          coords=[(x,y) for y in range(54) for x in range(96)
              if sum(abs(image.getpixel((x,y))[c]-bg[c]) for c in range(3))>90]
          bbox=([min(x for x,y in coords),min(y for x,y in coords),
                 max(x for x,y in coords),max(y for x,y in coords)] if coords else None)
          import json
          summary={"foreground_ratio":round(coverage,5),"foreground_bbox_96x54":bbox,
                   "status":"VISIBLE_THRESHOLD_PASS" if coverage>=0.025 else "VISUAL_REVIEW_REQUIRED"}
          print("GODOT002_STATIC_PIXEL_DIAGNOSTICS",json.dumps(summary))
          Path("out/godot-002/static-pixel-diagnostics.json").write_text(
              json.dumps(summary,indent=2))
          print("GODOT002_STATIC_MODEL_FRAMES_GENERATED")
          PY
          # Reframe only the second movie; keep the original static reference.
          python3 scripts/godot_002_autoframe.py > out/godot-002/autoframe.env
          set -a
          source out/godot-002/autoframe.env
          set +a
          echo "GODOT002_EXPORTED_AUTOFRAME_ZOOM=$GODOT002_ZOOM"
          # True no-motion control in *identical* transformed viewport.
          GODOT002_DISABLE_MOTIONS=1 GODOT002_FRAMED_STATIC=1 \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
            --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --write-movie "$GITHUB_WORKSPACE/out/godot-002/framed-static.png" \
            --fixed-fps 30 --quit-after 8 \
            2>&1 | tee out/godot-002/framed-static.log
          grep -q 'GODOT002_STATIC_MODEL_LOAD_PASS' out/godot-002/framed-static.log
          test "$(find out/godot-002 -name 'framed-static*.png' | wc -l)" -eq 8
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
            --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --write-movie "$GITHUB_WORKSPACE/out/godot-002/shot.png" \
            --fixed-fps 30 --quit-after 90 \
            2>&1 | tee out/godot-002/godot-render.log
          render_status=${PIPESTATUS[0]}
          set -e
          if [ "$render_status" -ne 0 ]; then
            echo "GODOT002_RUNTIME_CRASH rc=$render_status; collecting native stack trace"
            ulimit -c 0
            xvfb-run -a -s '-screen 0 1280x720x24' \
              gdb -q -batch \
              -ex 'set pagination off' -ex 'run' -ex 'thread apply all bt 20' \
              --args "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
              --audio-driver Dummy \
              --rendering-method gl_compatibility --rendering-driver opengl3 \
              --write-movie "$GITHUB_WORKSPACE/out/godot-002/debug-shot.png" \
              --fixed-fps 30 --quit-after 5 \
              2>&1 | tee out/godot-002/gdb-backtrace.log || true
            exit "$render_status"
          fi
          grep -q 'GODOT002_REAL_MOTION_STARTED' out/godot-002/godot-render.log
          ffmpeg -hide_banner -loglevel warning -y -framerate 30 \
            -pattern_type glob -i 'out/godot-002/shot*.png' \
            -c:v libx264 -crf 18 -pix_fmt yuv420p \
            out/godot-002/preview.mp4
      - name: Validate pixels, animation and MP4 independently
        shell: bash
        run: |
          set -euo pipefail
          python scripts/godot_002_verify.py
          python scripts/godot_003_visual_audit.py
          cat out/godot-002/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '### GODOT-003 visual metrics (not official Cubism parity)' >> "$GITHUB_STEP_SUMMARY"
          cat out/godot-002/visual-audit.json >> "$GITHUB_STEP_SUMMARY"
      - name: GODOT-003 full body camera sweep (9 real frames)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            python3 scripts/godot_003_camera_sweep.py "$GODOT_BIN" "$RUNNER_TEMP/gd002-project"
          test -s out/godot-002/fullbody-camera-sweep.jpg
          test -s out/godot-002/camera-sweep.json
      - name: GODOT-003 full-body corrected nod video (original rig / real motion)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          GODOT003_SWEEP: '1'
          GODOT003_SWEEP_ZOOM: '1.0'
          GODOT003_SWEEP_SHIFT_Y: '210'
        run: |
          set -euo pipefail
          GODOT002_DISABLE_MOTIONS=1 xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
            --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --write-movie "$GITHUB_WORKSPACE/out/godot-002/fullbody-static.png" \
            --fixed-fps 30 --quit-after 8 \
            2>&1 | tee out/godot-002/fullbody-static.log
          grep -q 'GODOT002_STATIC_MODEL_LOAD_PASS' out/godot-002/fullbody-static.log
          xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT_BIN" --path "$RUNNER_TEMP/gd002-project" \
            --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --write-movie "$GITHUB_WORKSPACE/out/godot-002/fullbody-anim.png" \
            --fixed-fps 30 --quit-after 90 \
            2>&1 | tee out/godot-002/fullbody-nod.log
          grep -q 'GODOT002_REAL_MOTION_STARTED' out/godot-002/fullbody-nod.log
          ffmpeg -hide_banner -loglevel warning -y -framerate 30 \
            -pattern_type glob -i 'out/godot-002/fullbody-anim*.png' \
            -c:v libx264 -crf 18 -pix_fmt yuv420p \
            out/godot-002/fullbody-nod.mp4
          python3 scripts/godot_003_fullbody_verify.py
          cat out/godot-002/fullbody-verify.json >> "$GITHUB_STEP_SUMMARY"
      - name: GODOT-004 native Live2D 1080p nod + idle / dark-white stills
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          GODOT003_SWEEP: '1'
          GODOT003_SWEEP_ZOOM: '1.0'
          GODOT003_SWEEP_SHIFT_Y: '210'
          GODOT004_HIRES: '1'
        run: |
          set -euo pipefail
          mkdir -p out/godot-004
          python3 - "$RUNNER_TEMP/gd002-project/project.godot" <<'PY'
          from pathlib import Path
          import sys
          f=Path(sys.argv[1])
          s=f.read_text()
          assert 'viewport_width=960' in s and 'viewport_height=540' in s
          f.write_text(s.replace('viewport_width=960','viewport_width=1920')
                        .replace('viewport_height=540','viewport_height=1080'))
          PY
          render_movie() {
            local file="$1" num="$2"
            xvfb-run -a -s '-screen 0 2048x1280x24' "$GODOT_BIN" \
              --path "$RUNNER_TEMP/gd002-project" --audio-driver Dummy \
              --rendering-method gl_compatibility --rendering-driver opengl3 \
              --write-movie "$GITHUB_WORKSPACE/out/godot-004/${file}.png" \
              --fixed-fps 30 --quit-after "$num" \
              2>&1 | tee "out/godot-004/${file}.log"
          }
          GODOT002_DISABLE_MOTIONS=1 render_movie dark-still 8
          grep -q 'GODOT004_HIRES_2X_APPLIED' out/godot-004/dark-still.log
          grep -q 'GODOT002_STATIC_MODEL_LOAD_PASS' out/godot-004/dark-still.log
          GODOT002_DISABLE_MOTIONS=1 GODOT004_BG_WHITE=1 render_movie white-still 1
          grep -q 'GODOT004_WHITE_BACKGROUND_ENABLED' out/godot-004/white-still.log
          for motion in nod idle; do
            GODOT004_MOTION_GROUP="$motion" render_movie "${motion}-frame" "$([ "$motion" = nod ] && echo 90 || echo 270)"
            grep -q "GODOT004_REAL_MOTION_GROUP_STARTED=${motion}" "out/godot-004/${motion}-frame.log" \
              || grep -q "GODOT004_REAL_MOTION_GROUP_STARTED= ${motion}" "out/godot-004/${motion}-frame.log"
            ffmpeg -hide_banner -loglevel warning -y -framerate 30 \
              -pattern_type glob -i "out/godot-004/${motion}-frame*.png" \
              -c:v libx264 -crf 18 -preset veryfast -pix_fmt yuv420p \
              "out/godot-004/${motion}-1080p.mp4"
          done
          python3 scripts/godot_004_hires_audit.py
          cat out/godot-004/quality-audit.json >> "$GITHUB_STEP_SUMMARY"
      - name: GODOT-004 owner-only draft review (game-derived videos)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for f in out/godot-004/{nod-1080p.mp4,idle-1080p.mp4,quality-audit.json,mask-contrast-head.jpg,nod-head-detail.jpg,idle-head-detail.jpg}; do
            if test -s "$f"; then files+=("$f"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          gh release create "godot-004-private-${GITHUB_RUN_NUMBER}" "${files[@]}" \
            --draft \
            --title "GODOT-004 PRIVATE 1080p / nod+body-idle #${GITHUB_RUN_NUMBER}" \
            --notes "Owner-only draft. Game-derived footage and original asset content must not be published. Motion/frame diagnostics do NOT certify visual parity with official Cubism."
      - name: GODOT-004 temporary 1080p audit attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-004-private-review-${{ github.run_number }}
          path: |
            out/godot-004/quality-audit.json
            out/godot-004/mask-contrast-head.jpg
            out/godot-004/nod-head-detail.jpg
            out/godot-004/idle-head-detail.jpg
          if-no-files-found: warn
          retention-days: 1
      - name: Keep one original character still in owner-only draft Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          frames=(out/godot-002/static*.png)
          if [ "${#frames[@]}" -eq 0 ]; then
            echo "GODOT002_NO_STATIC_PREVIEW_AVAILABLE"
            exit 0
          fi
          index=$((${#frames[@]} / 2))
          cp "${frames[$index]}" out/godot-002/static-reference.png
          files=(out/godot-002/static-reference.png out/godot-002/static-pixel-diagnostics.json)
          if test -s out/godot-002/preview.mp4; then
            files+=(out/godot-002/preview.mp4)
          fi
          for f in out/godot-002/summary.json out/godot-002/autoframe.json out/godot-002/contact-sheet.jpg out/godot-002/visual-audit.json out/godot-002/visual-comparison.jpg out/godot-002/visual-crops.jpg out/godot-002/fullbody-camera-sweep.jpg out/godot-002/camera-sweep.json out/godot-002/fullbody-nod.mp4 out/godot-002/fullbody-verify.json out/godot-002/fullbody-contact.jpg; do
            if test -s "$f"; then files+=("$f"); fi
          done
          tag="godot-002-static-inspection-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "${files[@]}" \
            --draft \
            --title "GODOT-002 private visual QA #${GITHUB_RUN_NUMBER}" \
            --notes "Draft only: unlicensed game-derived stills and motion preview. No public release, and visual/motion fidelity has NOT passed unless the independent summary explicitly says so."
      - name: Temporary video transfer attachment for owner's ChatGPT preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-002-owner-video-${{ github.run_number }}
          path: |
            out/godot-002/preview.mp4
            out/godot-002/fullbody-nod.mp4
            out/godot-002/fullbody-contact.jpg
            out/godot-002/contact-sheet.jpg
          if-no-files-found: warn
          retention-days: 1
      - name: Temporary close-up QA attachment (1-day, never in Git)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-003-inspection-samples-${{ github.run_number }}
          path: |
            out/godot-002/visual-comparison.jpg
            out/godot-002/visual-crops.jpg
            out/godot-002/fullbody-camera-sweep.jpg
            out/godot-002/fullbody-contact.jpg
            out/godot-002/fullbody-verify.json
            out/godot-002/camera-sweep.json
            out/godot-002/visual-audit.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload text-only diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-002-text-diagnostics-${{ github.run_number }}
          path: |
            out/godot-002/*.json
            out/godot-002/*.log
            out/godot-002/*.txt
            out/godot-002/*.sha256
          if-no-files-found: warn
          retention-days: 7
