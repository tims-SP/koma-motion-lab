name: MVP-009 project integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single documentation index and selected implementation
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const paths=cp.execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split('\n');
          const md=paths.filter(x=>x.endsWith('.md')).sort();
          if(JSON.stringify(md)!==JSON.stringify(['README.md','docs/MVP-009-plan.md'].sort()))
            throw Error('Documentation tree should contain index and canonical plan: '+md.join(','));
          const tasks=JSON.parse(fs.readFileSync('docs/MVP-009-tasks.json','utf8'));
          if(tasks.parentPlan!=='docs/MVP-009-plan.md'||tasks.selectedImplementation!=='B')throw Error('Architecture mismatch');
          const ids=new Set(tasks.tasks.map(t=>t.id));
          for(const t of tasks.tasks)if(t.dependsOn.some(x=>!ids.has(x)))throw Error('Missing dependency in '+t.id);
          for(const g of tasks.gates)if(!g.id||!g.status)throw Error('Missing gate data');
          if(paths.filter(x=>x.startsWith('.github/workflows/')).some(x=>!x.startsWith('.github/workflows/mvp009-')))
            throw Error('Unexpected workflow');
          console.log('MVP009_PROJECT_INTEGRITY_PASS');
          NODE
