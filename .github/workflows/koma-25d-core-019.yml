name: CORE-019 · real native Inox2D isolated Aka-ear OpenGL pixels

on:
  push:
    branches: [feature/koma-25d-core-019]
    paths:
      - '.github/workflows/koma-25d-core-019.yml'
      - 'experiments/koma-25d-core/tools/patch_inox_ears_only19.py'
      - 'experiments/koma-25d-core/tools/qa_native_ears_only19.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-puppet-preserved-ear-draw-filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install original OpenGL/X11 runtime and PNG QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb-xfixes0-dev libwayland-dev pkg-config xvfb xauth xdotool mesa-utils ffmpeg
          python3 -m venv "$RUNNER_TEMP/core019"
          "$RUNNER_TEMP/core019/bin/pip" install "Pillow==12.0.0" "numpy==2.2.6"
          echo "$RUNNER_TEMP/core019/bin" >> "$GITHUB_PATH"
      - name: Download fixed full Aka INX and pinned upstream Rust renderer
        run: |
          set -euo pipefail
          mkdir -p experiments/koma-25d-core/out/core019
          curl -fsSL --retry 3 --max-time 180 \
            https://media.githubusercontent.com/media/Inochi2D/example-models/cd95dd00ddff63b1f7d2b84a19914c3c70d05945/Aka.inx \
            -o "$RUNNER_TEMP/Aka.inx"
          printf '%s  %s\n' dbf82ffb86d1c761bca883ad37ec1c47487a447f8104290b459ce60aaee81e0f "$RUNNER_TEMP/Aka.inx" | sha256sum -c
          git clone --quiet https://github.com/Inochi2D/inox2d.git "$RUNNER_TEMP/inox2d"
          git -C "$RUNNER_TEMP/inox2d" checkout -q d4dd9dd7f16b775042cbda44370570abf9a8cf81
      - name: Patch ONLY debug draw filter, fixed source parameters, source GL resize
        run: |
          python experiments/koma-25d-core/tools/patch_inox_fixed8.py \
            --checkout "$RUNNER_TEMP/inox2d" \
            --report experiments/koma-25d-core/out/core019/source_parameter_patch.json
          python experiments/koma-25d-core/tools/patch_inox_ears_only19.py \
            --checkout "$RUNNER_TEMP/inox2d" \
            --report experiments/koma-25d-core/out/core019/native_draw_filter.json
          cargo build --release --manifest-path "$RUNNER_TEMP/inox2d/Cargo.toml" -p render-opengl
      - name: Render TWO independent original-ear-only HeadYaw states with Mesa OpenGL
        run: |
          set -euo pipefail
          out=experiments/koma-25d-core/out/core019
          export DISPLAY=:88 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          export KOMA_NATIVE_EARS_ONLY=1
          Xvfb :88 -screen 0 1024x900x24 -ac +extension GLX +render -noreset > "$out/xvfb.log" 2>&1 &
          xvfbpid=$!
          sleep 3
          glxinfo -B > "$out/glxinfo.txt"
          xdotool mousemove 1010 880 || true
          for pair in "neutral 0.50" "maximum 1.00"; do
            read -r tag val <<< "$pair"
            export KOMA_HEAD_YAW="$val"
            "$RUNNER_TEMP/inox2d/target/release/render-opengl" "$RUNNER_TEMP/Aka.inx" > "$out/native_$tag.log" 2>&1 &
            pid=$!
            sleep 5
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -80 "$out/native_$tag.log"
              exit 1
            fi
            xdotool search --name "Render Inochi2D Puppet" windowmove 0 0 || true
            sleep 2
            ffmpeg -hide_banner -loglevel error -y -f x11grab -video_size 1024x900 -framerate 1 -i :88.0+0,0 -frames:v 1 "$out/gpu_ears_$tag.x11.png"
            if grep -Eq "FBO incomplete|GL_INVALID_FRAMEBUFFER_OPERATION|thread.*panicked" "$out/native_$tag.log"; then
              tail -120 "$out/native_$tag.log"
              exit 1
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" || true
            sleep 1
          done
          kill "$xvfbpid" 2>/dev/null || true
      - name: Actually pixel-audit GPU-only original ear outputs, not source JSON
        run: |
          python experiments/koma-25d-core/tools/qa_native_ears_only19.py --input experiments/koma-25d-core/out/core019
      - name: Publish actual native OpenGL PNGs and provenance as regular Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORE019-real-Inox-Aka-native-ear-only-GL-frames
          path: experiments/koma-25d-core/out/core019/
          retention-days: 30
          if-no-files-found: error
