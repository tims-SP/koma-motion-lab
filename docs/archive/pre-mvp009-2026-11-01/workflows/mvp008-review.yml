name: MVP-008 geometry-space facial mask visual continuity and dynamic occlusion
on:
  workflow_run:
    workflows: ["MVP-008 dynamic 360° with arm IK and head VDD"]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: mvp008-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TS and Chromium
        working-directory: experiments/mvp002
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg
      - name: Real isolated Alpha versus final ID buffer at moving poses
        working-directory: experiments/mvp002
        run: xvfb-run -a npm run audit:dynamic360
      - name: Download video only from matching source commit and verified workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p reviewed
          run_id="${SOURCE_RUN_ID}"
          if test -z "$run_id"; then
            run_id="$(gh run list --repo tims-SP/koma-motion-lab --workflow mvp008-dynamic360.yml --branch main --limit 10 --json databaseId,headSha,conclusion \
              --jq '.[] | select(.headSha == env.GITHUB_SHA and .conclusion == "success") | .databaseId' | head -1)"
          fi
          test -n "$run_id" || { echo 'No matching 192-frame source run'; exit 1; }
          run_sha="$(gh api "repos/tims-SP/koma-motion-lab/actions/runs/$run_id" --jq '.head_sha')"
          test "$run_sha" = "$(git rev-parse HEAD)" || {
            echo "Stale video refused: $run_sha does not match $(git rev-parse HEAD)"; exit 1;
          }
          gh run download "$run_id" --repo tims-SP/koma-motion-lab \
            --name mvp008-dynamic360-evidence --dir reviewed
          test -s reviewed/dynamic360-8s.mp4
          test -s reviewed/dynamic-angle-board.png
          test -s reviewed/transition-038-045.png
          test -s reviewed/transition-128-136.png
          echo "$run_id" > reviewed/source-run-id.txt
      - name: Emit bounded JPEGs for model visual review from REAL MP4
        run: |
          set -euo pipefail
          mkdir -p reviewed/qa
          ffmpeg -hide_banner -loglevel error -y -i reviewed/dynamic-angle-board.png \
            -vf "scale=1080:-2" -q:v 12 reviewed/qa/board.jpg
          for frame in 038 039 040 041 042 043 044 045 090 128 129 130 131 132 133 134 135 136 144; do
            ffmpeg -hide_banner -loglevel error -y -i reviewed/dynamic360-8s.mp4 \
              -vf "select='eq(n,${frame})',scale=640:-2" -vsync 0 -frames:v 1 \
              -q:v 10 "reviewed/qa/frame-${frame}.jpg"
          done
          for item in reviewed/qa/*.jpg; do
            name="$(basename "$item" .jpg)"
            printf 'MODEL_QA_%s_BEGIN\n' "$name"
            base64 -w0 "$item"
            printf '\nMODEL_QA_%s_END\n' "$name"
          done
      - name: Upload occlusion and review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp008-dynamic-local-occlusion-and-visual-review
          retention-days: 20
          if-no-files-found: warn
          path: |
            experiments/mvp002/out/dynamic-occlusion/*
            reviewed/qa/*.jpg
            reviewed/transition-*.png
            reviewed/source-run-id.txt
      - name: Optional owner Draft Release for full actual video
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="mvp008-dynamic360-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            reviewed/dynamic360-8s.mp4 \
            reviewed/dynamic-angle-board.png \
            experiments/mvp002/out/dynamic-occlusion/dynamic-occlusion-audit.json \
            --repo tims-SP/koma-motion-lab --target "$GITHUB_SHA" --draft \
            --title "MVP-008 dynamic 360° minimal technical review (NOT production-art acceptance)" \
            --notes "Video and frame strips are tied to exact source commit; automatic geometry checks alone do not establish visual acceptance. No anime-quality or planted-foot claim."
